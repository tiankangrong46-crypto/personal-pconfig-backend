[build]
builder = "RAILPACK"
buildCommand = "python -m pip install -r requirements.txt && cd frontend && npm ci && npm run build"

[deploy]
startCommand = "python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py import_frontend_components && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -"
healthcheckPath = "/api/health/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
